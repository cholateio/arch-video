<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 812" role="img" aria-labelledby="ab-title ab-desc" font-family="'JetBrains Mono',monospace">
  <title id="ab-title">arch-blueprint skill overview</title>
  <desc id="ab-desc">An agent reads the target repo under the rules in SKILL.md, proposes a split, writes an SVG using the icon library, and loops through check.py and a visual check before the overview is delivered.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2h8l4 4v16H6V2z"/>
      <path d="M14 2v4h4"/>
      <line x1="9" y1="12" x2="15" y2="12"/>
      <line x1="9" y1="16" x2="15" y2="16"/>
    </symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/>
      <path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10.5" cy="10.5" r="6.5"/>
      <line x1="15.5" y1="15.5" x2="21" y2="21"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>
    </symbol>
    <symbol id="icon-terminal" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <path d="M6 10l3 2-3 2"/>
      <line x1="11" y1="15" x2="16" y2="15"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/>
      <path d="M9 12l2 2 4-4"/>
    </symbol>
    <symbol id="icon-browser" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="2"/>
      <line x1="2" y1="9" x2="22" y2="9"/>
      <circle cx="5.5" cy="6.5" r="0.5"/>
      <circle cx="8" cy="6.5" r="0.5"/>
    </symbol>
  </defs>

  <rect width="1200" height="812" fill="#faf8f4"/>

  <text x="600" y="84" font-size="28" letter-spacing="6" text-anchor="middle" fill="#1a1a1a">ARCH-BLUEPRINT · SKILL OVERVIEW</text>

  <g class="zone" id="zone-skill" fill="none" stroke="#1a1a1a">
    <rect x="96" y="312" width="240" height="344" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="120" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">SKILL FILES</text>
    <path d="M120,348 H168" stroke-width="1.5"/>
  </g>
  <g class="zone" id="zone-input" fill="none" stroke="#1a1a1a">
    <rect x="480" y="120" width="240" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="504" y="148" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">INPUT</text>
    <path d="M504,156 H552" stroke-width="1.5"/>
  </g>
  <g class="zone" id="zone-agent" fill="none" stroke="#1a1a1a">
    <rect x="480" y="312" width="240" height="344" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="504" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">AGENT</text>
    <path d="M504,348 H552" stroke-width="1.5"/>
  </g>
  <g class="zone" id="zone-verify" fill="none" stroke="#1a1a1a">
    <rect x="864" y="312" width="240" height="248" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="888" y="340" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">VERIFY</text>
    <path d="M888,348 H936" stroke-width="1.5"/>
  </g>
  <g class="zone" id="zone-output" fill="none" stroke="#1a1a1a">
    <rect x="864" y="600" width="240" height="152" rx="16" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="888" y="628" font-size="16" letter-spacing="3" fill="#1a1a1a" stroke="none">OUTPUT</text>
    <path d="M888,636 H936" stroke-width="1.5"/>
  </g>

  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path class="edge" id="e-repo-analyzer" d="M600,248 V370" marker-end="url(#ah)"/>
    <path class="edge" id="e-skillmd-analyzer" d="M312,408 H498" stroke-dasharray="4 4"/>
    <path class="edge" id="e-example-writer" d="M312,504 H408 V584 H498" stroke-dasharray="4 4"/>
    <path class="edge" id="e-icons-writer" d="M312,600 H498" marker-end="url(#ah)"/>
    <path class="edge" id="e-analyzer-proposal" d="M600,440 V466" marker-end="url(#ah)"/>
    <path class="edge" id="e-proposal-writer" d="M600,536 V562" marker-end="url(#ah)"/>
    <path class="edge" id="e-writer-check" d="M696,592 H792 V408 H882" marker-end="url(#ah)"/>
    <path class="edge" id="e-check-writer" d="M888,424 H808 V608 H702" marker-end="url(#ah)"/>
    <path class="edge" id="e-check-visual" d="M984,440 V466" marker-end="url(#ah)"/>
    <path class="edge" id="e-visual-overview" d="M984,536 V658" marker-end="url(#ah)"/>
  </g>

  <g class="node" id="n-repo">
    <rect x="504" y="184" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="520" y="204" width="24" height="24"/>
    <text x="560" y="212" font-size="14" font-weight="600" fill="#1a1a1a">Target Repo</text>
    <text x="560" y="230" font-size="11" fill="#1a1a1a" fill-opacity="0.65">README + layout</text>
  </g>
  <g class="node" id="n-skillmd">
    <rect x="120" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="136" y="396" width="24" height="24"/>
    <text x="176" y="404" font-size="14" font-weight="600" fill="#1a1a1a">SKILL.md</text>
    <text x="176" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Workflow + rules</text>
  </g>
  <g class="node" id="n-example">
    <rect x="120" y="472" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="136" y="492" width="24" height="24"/>
    <text x="176" y="500" font-size="14" font-weight="600" fill="#1a1a1a">Example SVG</text>
    <text x="176" y="518" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Reference layout</text>
  </g>
  <g class="node" id="n-icons">
    <rect x="120" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-sparkle" x="136" y="588" width="24" height="24"/>
    <text x="176" y="596" font-size="14" font-weight="600" fill="#1a1a1a">Icon Library</text>
    <text x="176" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">13 line icons</text>
  </g>
  <g class="node" id="n-analyzer">
    <rect x="504" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-search" x="520" y="396" width="24" height="24"/>
    <text x="560" y="404" font-size="14" font-weight="600" fill="#1a1a1a">Analyzer</text>
    <text x="560" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Module boundaries</text>
  </g>
  <g class="node" id="n-proposal">
    <rect x="504" y="472" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-gear" x="520" y="492" width="24" height="24"/>
    <text x="560" y="500" font-size="14" font-weight="600" fill="#1a1a1a">Proposal</text>
    <text x="560" y="518" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Zones nodes flows</text>
  </g>
  <g class="node" id="n-writer">
    <rect x="504" y="568" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-terminal" x="520" y="588" width="24" height="24"/>
    <text x="560" y="596" font-size="14" font-weight="600" fill="#1a1a1a">SVG Writer</text>
    <text x="560" y="614" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Hand-written SVG</text>
  </g>
  <g class="node" id="n-check">
    <rect x="888" y="376" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-shield" x="904" y="396" width="24" height="24"/>
    <text x="944" y="404" font-size="14" font-weight="600" fill="#1a1a1a">check.py</text>
    <text x="944" y="422" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Quantified rules</text>
  </g>
  <g class="node" id="n-visual">
    <rect x="888" y="472" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-browser" x="904" y="492" width="24" height="24"/>
    <text x="944" y="500" font-size="14" font-weight="600" fill="#1a1a1a">Visual Check</text>
    <text x="944" y="518" font-size="11" fill="#1a1a1a" fill-opacity="0.65">Open in browser</text>
  </g>
  <g class="node" id="n-overview">
    <rect x="888" y="664" width="192" height="64" rx="10" fill="#faf8f4" stroke="#1a1a1a" stroke-width="1.5"/>
    <use href="#icon-file" x="904" y="684" width="24" height="24"/>
    <text x="944" y="692" font-size="14" font-weight="600" fill="#1a1a1a">overview.svg</text>
    <text x="944" y="710" font-size="11" fill="#1a1a1a" fill-opacity="0.65">docs/architecture</text>
  </g>

  <g class="label" id="l-symbols" data-edge="e-icons-writer">
    <rect x="340" y="606" width="57" height="14" fill="#faf8f4"/>
    <text x="344" y="616" font-size="10" letter-spacing="1" fill="#1a1a1a">SYMBOLS</text>
  </g>
  <g class="label" id="l-approved" data-edge="e-proposal-writer">
    <rect x="606" y="544" width="106" height="14" fill="#faf8f4"/>
    <text x="610" y="554" font-size="10" letter-spacing="1" fill="#1a1a1a">APPROVED SPLIT</text>
  </g>
  <g class="label" id="l-draft" data-edge="e-writer-check">
    <rect x="704" y="572" width="71" height="14" fill="#faf8f4"/>
    <text x="708" y="582" font-size="10" letter-spacing="1" fill="#1a1a1a">DRAFT SVG</text>
  </g>
  <g class="label" id="l-errors" data-edge="e-check-writer">
    <rect x="716" y="614" width="50" height="14" fill="#faf8f4"/>
    <text x="720" y="624" font-size="10" letter-spacing="1" fill="#1a1a1a">ERRORS</text>
  </g>
</svg>
